name: Workflow Service CI

on:
  push:
    branches: [ main, master, dev ]
    paths:
      - 'workflow-automation-backend/workflow-service/**'
      - '.github/workflows/workflow-service.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'workflow-automation-backend/workflow-service/**'
  workflow_dispatch:

jobs:
  build:
    name: Build, Test and analyze 
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflow-automation-backend/workflow-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Create .env file
        run: |
          cat > .env << EOF
          DB_URL=${{ secrets.DB_URL }}
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Cache SonarQube Cloud packages      # NEW: faster later runs
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, Test and Analyze            
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B clean verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dspring.profiles.active=test
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=oumacode
          -Dsonar.projectKey=oumacode_autoflow_workflow-service
